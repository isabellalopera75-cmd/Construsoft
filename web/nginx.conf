# La parte web de ConstruSoft en producción: solo archivos estáticos.
#
# /api no pasa por aquí. En Dokploy, el proxy del servidor (Traefik) manda
# /api a la API y el resto a este contenedor, con el mismo dominio: la cookie
# de sesión es SameSite=Strict y necesita que todo salga del mismo sitio.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Las redirecciones salen relativas («/superadmin/»). Detrás del proxy con
    # HTTPS, una absoluta saldría con http:// y el navegador la rechazaría o
    # perdería la cookie.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Cabeceras de seguridad. Probadas con las pantallas de la aplicación y del
    # panel (DISENO, 21 de octubre de 2026):
    # - todo sale del propio dominio: los scripts, los estilos, las fuentes
    #   (servidas desde npm, nunca de Google) y las llamadas a /api;
    # - font-src admite data: porque Vite mete dentro del CSS las fuentes de
    #   menos de 4 KB;
    # - img-src admite blob: por la vista previa del logotipo en el registro;
    # - nadie puede meter la aplicación en un marco ajeno.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Los archivos de assets/ llevan su huella en el nombre: no cambian nunca.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # El panel del superadministrador es otra aplicación, en su carpeta.
    location = /superadmin {
        return 301 /superadmin/;
    }

    # Las direcciones de la aplicación van con «#», así que no hace falta
    # devolver index.html para una ruta desconocida: lo que no existe es 404.
    # Las páginas se revalidan siempre, para que una versión nueva se vea al
    # recargar.
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
